<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stress Out - Cóctel de Autor</title>
    <style>
        :root {
            --bg-principal: #0b0f12; /* Fondo oscuro profundo, inspirado en noches de bar */
            --bg-tarjeta: #161d24;    /* Gris azulado oscuro para contraste */
            --verde-lima: #a3e635;    /* Toque cítrico brillante */
            --verde-menta: #2ed573;   /* Toque fresco */
            --texto-claro: #f3f4f6;   /* Blanco suave para no cansar la vista */
            --texto-mutado: #9ca3af;  /* Gris claro para detalles */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-principal);
            color: var(--texto-claro);
            line-height: 1.6;
            padding: 20px;
        }

        .contenedor {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        header h1 {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(to right, var(--texto-claro), var(--verde-lima));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        header p {
            color: var(--texto-mutado);
            font-size: 1.1rem;
            letter-spacing: 1px;
        }

        /* Cuadrícula principal */
        .grid-contenido {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 40px;
            align-items: start;
        }

        /* Contenedor especial para la imagen (Garantiza accesibilidad y resalta el trago) */
        .bloque-imagen {
            position: relative;
            background: linear-gradient(135deg, rgba(163, 230, 53, 0.1), rgba(46, 213, 115, 0.05));
            padding: 20px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Brillo cítrico de fondo detrás de la foto */
        .bloque-imagen::before {
            content: '';
            position: absolute;
            width: 150px;
            height: 150px;
            background: var(--verde-lima);
            filter: blur(80px);
            opacity: 0.2;
            z-index: -1;
            top: 10%;
        }

        .bloque-imagen img {
            width: 100%;
            max-width: 380px;
            height: auto;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            object-fit: cover;
            display: block;
        }

        /* Bloques de texto */
        .bloque-info {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .tarjeta {
            background-color: var(--bg-tarjeta);
            padding: 35px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        h2 {
            font-size: 1.6rem;
            color: var(--texto-claro);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h2::before {
            content: '';
            display: inline-block;
            width: 6px;
            height: 20px;
            background-color: var(--verde-lima);
            border-radius: 4px;
        }

        .historia-texto {
            color: var(--texto-mutado);
            font-size: 1.05rem;
            text-align: left;
            white-space: pre-line;
        }

        /* Lista de Ingredientes Estilizada */
        .lista-ingredientes {
            list-style: none;
        }

        .lista-ingredientes li {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 1.1rem;
        }

        .lista-ingredientes li span:last-child {
            color: var(--verde-lima);
            font-weight: 600;
        }

        /* Pasos de preparación simplistas */
        .pasos-preparacion {
            display: flex;
